services:
  # 1. React Web Dashboard (Static Site)
  - type: web
    name: buildops-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: apps/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  # 2. Node.js Express API Service
  - type: web
    name: buildops-api
    env: node
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: buildops-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        value: http://buildops-ml-service:8000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # 3. Python FastAPI ML Service
  - type: web
    name: buildops-ml-service
    env: python
    region: oregon
    plan: free
    rootDir: apps/ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  # 4. Managed PostgreSQL 15 Instance
  - name: buildops-postgres
    databaseName: buildops
    user: buildops_user
    plan: free
    region: oregon
