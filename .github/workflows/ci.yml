name: BuildOps Sentinel CI/CD Pipeline

on:
  push:
    branches: [ main, "sprint/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build Sub-Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: buildops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            db/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/ml-service/requirements.txt

      # 1. Test Database Schema & Migrations
      - name: DB — Install & Test Schema
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/buildops
        run: |
          cd db
          npm ci
          npm run migrate
          npm test

      # 2. Test Express API Backend
      - name: Express API — Install & Test
        run: |
          cd apps/api
          npm ci
          npm test

      # 3. Test FastAPI ML Service
      - name: FastAPI ML Service — Install & Test
        run: |
          cd apps/ml-service
          pip install -r requirements.txt
          python test_health.py

      # 4. Build React Web Dashboard
      - name: React Web — Install & Build
        run: |
          cd apps/web
          npm ci
          npm run build

  deploy-stub:
    name: Render Deploy Stub
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Render Deploy Blueprint Check
        run: |
          echo "✅ CI checks passed on main. Render blueprint ready for deployment."
          test -f render.yaml || (echo "render.yaml missing" && exit 1)
